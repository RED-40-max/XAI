<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Defend the Agent Game</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="void-backdrop" aria-hidden="true">
    <canvas id="starfield" width="100" height="100"></canvas>
    <div class="void-vignette"></div>
    <div class="void-scanlines"></div>
  </div>
  <main class="page shell">
    <p class="eyebrow">Section 3</p>
    <h1 data-aos="fade-up">Defend the Agent</h1>
    <p data-aos="fade-up" data-aos-delay="80">
      Part 3 is embedded below. Move with arrow keys and press space to shoot. Survive all 3 rounds of bugs.
    </p>

    <section class="output-box" data-aos="fade-up" data-aos-delay="120">
      <h2>Embedded Part 3 Game</h2>
      <iframe
        src="SpaceInvaders/index.html?embed=1"
        title="Part 3 Defend the Agent Game"
        class="embedded-part3"
        loading="lazy"
      ></iframe>
    </section>

    <p data-aos="fade-up" data-aos-delay="200"><a class="button" href="index.html">← Back to Main Story</a></p>
  </main>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="starfield.js?v=2"></script>
  <script>
    if (window.Starfield) {
      window.Starfield.init({ canvasId: "starfield", mood: "technical" });
    }
  </script>
</body>
</html>
