<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Defend the Agent Game</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="void-backdrop" aria-hidden="true">
    <canvas id="starfield" width="100" height="100"></canvas>
    <div class="void-vignette"></div>
    <div class="void-scanlines"></div>
  </div>
  <main class="page shell">
    <p class="eyebrow">Section 3</p>
    <h1 data-aos="fade-up">Defend the Agent</h1>
    <p data-aos="fade-up" data-aos-delay="80">
      Move with arrow keys and press space to shoot. Each invader bug stands for a common AI failure mode.
    </p>

    <div class="defense-panel" data-aos="fade-up" data-aos-delay="160">
      <canvas id="gameCanvas" width="760" height="420"></canvas>
      <div class="game-controls">
        <button class="button" id="startGame">Start / Restart</button>
        <span id="scoreLabel">Score: 0</span>
        <span id="statusLabel">Status: Ready</span>
      </div>
    </div>

    <section id="bug-output" class="output-box" data-aos="fade-up" data-aos-delay="240">
      <h2>Bug Decoder</h2>
      <p>Shoot a bug in-game to see what it represents.</p>
    </section>

    <p data-aos="fade-up" data-aos-delay="320"><a class="button" href="index.html">← Back to Main Story</a></p>
  </main>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="starfield.js?v=2"></script>
  <script>
    if (window.Starfield) {
      window.Starfield.init({ canvasId: "starfield", mood: "technical" });
    }
  </script>
  <script src="section3.js?v=2"></script>
</body>
</html>
