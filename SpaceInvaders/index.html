<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Space Invaders</title>
    <link href="https://fonts.googleapis.com/css?family=Audiowide|Press+Start+2P" rel="stylesheet">
    <link rel="stylesheet" href="Styles/main.css">
    <link rel="icon" href="http://www.unixstickers.com/image/cache/data/stickers/spaceinvaders/Space-medium-invader.sh-600x600.png">
  </head>
  <body>
    <canvas id="background-canvas"></canvas>
    <canvas id="game-canvas" width="700" height="600"></canvas>
    <div id="part3-modal" class="part3-modal hidden" role="dialog" aria-modal="true" aria-labelledby="part3-modal-title">
      <div class="part3-modal__card">
        <h2 id="part3-modal-title"></h2>
        <p id="part3-modal-tagline" class="part3-modal__tagline"></p>
        <p id="part3-modal-description"></p>
        <h3>What happens</h3>
        <ul id="part3-modal-bullets"></ul>
        <h3>Real-world implication</h3>
        <p id="part3-modal-anecdote"></p>
        <button id="part3-modal-continue" type="button">Continue</button>
      </div>
    </div>

    <script type="text/javascript" src="Scripts/background.js"></script>
    <script type="text/javascript" src="Scripts/script.js"></script>
  </body>
</html>
