<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build the Agent Factory</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="void-backdrop" aria-hidden="true">
    <canvas id="starfield" width="100" height="100"></canvas>
    <div class="void-vignette"></div>
    <div class="void-scanlines"></div>
  </div>
  <main class="page shell">
    <p class="eyebrow">Section 2</p>
    <h1 data-aos="fade-up">Build the Agent Factory</h1>
    <p data-aos="fade-up" data-aos-delay="80">
      Click the parts in any order. Each click adds one component to your beginner-friendly "agent machine."
    </p>

    <div class="card-grid" data-aos="fade-up" data-aos-delay="150">
      <button class="card" data-part="goal">Goal Parser</button>
      <button class="card" data-part="memory">Memory Bank</button>
      <button class="card" data-part="tools">Tool Belt</button>
      <button class="card" data-part="safety">Safety Guard</button>
      <button class="card" data-part="feedback">Feedback Loop</button>
    </div>

    <section id="output" class="output-box" data-aos="fade-up" data-aos-delay="220">
      <h2>Factory Console</h2>
      <p>Select a component to inspect how it works.</p>
    </section>

    <div class="factory-status" data-aos="fade-up" data-aos-delay="280">
      Build progress: <span id="buildCount">0</span>/5
      <div class="progress-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>

    <p data-aos="fade-up" data-aos-delay="320"><a class="button" href="index.html">← Back to Main Story</a></p>
  </main>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="starfield.js"></script>
  <script>
    if (window.Starfield) {
      window.Starfield.init({ canvasId: "starfield", mood: "technical" });
    }
  </script>
  <script src="section2.js"></script>
</body>
</html>
